// Waterfall effects

// tested syl-eng-250-M1, effects need adjustment
@PART[syl-eng-250-M1]:NEEDS[Waterfall]:AFTER[SpaceY]
{
	!EFFECTS {}
	EFFECTS
	{
		running_closed
		{
			AUDIO
			{
				channel = Ship
				clip = sound_rocket_spurts // SpaceY-Lifters/Sounds/sls_loop_high
				volume = 0.0 0.0
				volume = 0.2 0.35
				volume = 1.0 0.7
				pitch = 0.0 0.5
				pitch = 1.0 1.0
				loop = true
			}
		}
		engage
		{
			AUDIO
			{
				channel = Ship
				clip = sound_vent_soft
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
		flameout
		{
			PREFAB_PARTICLE
			{
				prefabName = fx_exhaustSparks_flameout_2
				transformName = smokeTransform
				oneShot = true
			}
			AUDIO
			{
				channel = Ship
				clip = sound_explosion_low
				volume = 1.0
				pitch = 2.0
				loop = false
			}
		}
	}

	MODULE
	{
		name = ModuleWaterfallFX

		moduleID = myEngineFX

		CONTROLLER
		{
			name = throttle
			linkedTo = throttle
		}

		CONTROLLER
		{
			name = atmosphereDepth
			linkedTo = atmosphere_density
		}

		TEMPLATE:NEEDS[CryoEngines]
		{
			templateName = waterfall-hydrolox-lower-3
			overrideParentTransform = thrustTransform // fxTransform
			position = 0,0,0
			rotation = 0,0,0
			scale = 0.8, 0.8, 0.8
		}
		TEMPLATE:NEEDS[!CryoEngines]
		{
			templateName = waterfall-kerolox-lower-3
			overrideParentTransform = thrustTransform // fxTransform
			position = 0,0,-0.05
			rotation = 0,0,0
			scale = 0.8, 0.8, 0.8
		}
	}
}

